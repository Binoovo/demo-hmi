<div class="alarm-groups-container">
  <h1 class="page-title">Tabla de Grupos de Alarmas</h1>

  <div class="table-section">
    <div class="table-toolbar">
      <button pButton
              type="button"
              label="Crear"
              icon="pi pi-plus"
              class="p-button-success"
              [disabled]="true"></button>
    </div>

    <p-table [value]="alarmGroups"
             [paginator]="true"
             [rows]="10"
             [showCurrentPageReport]="true"
             currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} Grupos"
             [tableStyle]="{'min-width': '50rem'}">

      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="groupName">Nombre de Grupo <p-sortIcon field="groupName"></p-sortIcon></th>
          <th pSortableColumn="emailGroup">Grupo de Correo <p-sortIcon field="emailGroup"></p-sortIcon></th>
          <th pSortableColumn="alarmCount">Cantidad de Alarmas Relacionadas <p-sortIcon field="alarmCount"></p-sortIcon></th>
          <th style="width: 120px">Acciones</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-group>
        <tr>
          <td>{{ group.groupName }}</td>
          <td>{{ group.emailGroup }}</td>
          <td>{{ group.alarmCount }}</td>
          <td>
            <div class="action-buttons">
              <button pButton
                      type="button"
                      icon="pi pi-trash"
                      class="p-button-rounded p-button-text p-button-danger"
                      [disabled]="true"></button>
              <button pButton
                      type="button"
                      icon="pi pi-pencil"
                      class="p-button-rounded p-button-text p-button-success"
                      [disabled]="true"></button>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
