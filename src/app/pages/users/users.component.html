<div class="users-container">
  <h1 class="page-title">Tabla de usuarios</h1>

  <div class="users-table-section">
    <div class="table-toolbar">
      <button pButton type="button" label="Usuarios" icon="pi pi-plus" class="p-button" [disabled]="true"></button>
    </div>

    <p-table [value]="users"
             [paginator]="true"
             [rows]="10"
             [showCurrentPageReport]="true"
             currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} Usuarios"
             [tableStyle]="{'min-width': '50rem'}">

      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="name">Name <p-sortIcon field="name"></p-sortIcon></th>
          <th pSortableColumn="email">Email <p-sortIcon field="email"></p-sortIcon></th>
          <th>Image</th>
          <th pSortableColumn="password">Password <p-sortIcon field="password"></p-sortIcon></th>
          <th pSortableColumn="role">Role <p-sortIcon field="role"></p-sortIcon></th>
          <th style="width: 10rem">Acciones</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-user>
        <tr>
          <td>{{ user.name }}</td>
          <td>{{ user.email }}</td>
          <td>
            <img *ngIf="user.image" [src]="user.image" [alt]="user.name" width="32" style="vertical-align: middle" />
            <i *ngIf="!user.image" class="pi pi-user" style="font-size: 1.5rem; color: #94a3b8;"></i>
          </td>
          <td>{{ user.password }}</td>
          <td>
            <span class="role-badge admin">{{ user.role }}</span>
          </td>
          <td>
            <div class="action-buttons">
              <button pButton
                      type="button"
                      icon="pi pi-pencil"
                      class="p-button-rounded p-button-text p-button-info"
                      [disabled]="true"></button>
              <button pButton
                      type="button"
                      icon="pi pi-trash"
                      class="p-button-rounded p-button-text p-button-danger"
                      [disabled]="true"></button>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
